name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract source
        run: unzip -q Metro-Rush-Android-Source.zip -d source
      - name: Build APK
        run: bash source/metro-rush/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Metro-Rush-Android
          path: source/metro-rush/build/Metro-Rush.apk

